server:
  port: 8084

services:
  bootcamps:
    base-url: http://localhost:8083
  reportes:
    base-url: http://localhost:8085

spring:
  application:
    name: persona-service
  r2dbc:
    url: r2dbc:mysql://localhost:3306/personas_db
    username: root
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

